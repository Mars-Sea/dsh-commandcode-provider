name: Security Scans

on:
  push:
    branches: [main]
  pull_request:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      # 本包的运行时依赖为空（`dependencies: []`），发布产物不带任何第三方运行时包，
      # 所以阻断项只看生产依赖。开发工具链（tsdown → tinyglobby／fdir → picomatch）目前
      # 有一个**没有修复版本**的 ReDoS 通告 GHSA-fc5q-39xc-vjpf（CVE-2026-112366，high，
      # 影响 picomatch ≤ 4.0.7，而 4.0.7 已是 npm 最新版），全量审计仍执行并把结果打到
      # 日志，但不阻断合并。上游发布修复版本后，把两步合回一条 `npm audit --audit-level=high`。
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Audit development dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
      - name: Run CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
